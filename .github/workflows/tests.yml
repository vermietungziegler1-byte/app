name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # npm install statt npm ci: neue Pakete aus package.json kommen dazu, auch wenn die Sperrdatei
      # (package-lock.json) noch den alten Stand hat — auf dem Server macht einspielen es genauso
      - run: npm install --no-audit --no-fund
      - name: Browser für den Oberflächen-Test
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Servercode und einspielen prüfen
        run: |
          for f in server.js lib/*.js; do node --check "$f"; done
          bash -n ../werkzeuge/einspielen.sh
      - name: Tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-ausgabe.txt
      # Die Protokolle sieht man bei GitHub nur angemeldet — die Fehler stehen deshalb auch in der Zusammenfassung des Laufs
      - name: Fehler in die Zusammenfassung
        if: failure()
        run: |
          {
            echo '### Fehlgeschlagene Tests'
            echo '```'
            grep -A45 'not ok' test-ausgabe.txt | head -400 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
