name: Tests

on:
  push:
  pull_request:

# Ein neuer Push bricht den noch laufenden Lauf desselben Zweigs ab — ein hängender Lauf hält so nichts auf
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Fest auf 24.04: ubuntu-latest zieht seit Oktober 2026 schrittweise auf Ubuntu 26 um, und der Browser für den
    # Oberflächen-Test bringt seine Systempakete je Ubuntu-Fassung mit
    runs-on: ubuntu-24.04
    # Sonst läuft ein hängender Lauf bis zu sechs Stunden
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # npm install statt npm ci: neue Pakete aus package.json kommen dazu, auch wenn die Sperrdatei
      # (package-lock.json) noch den alten Stand hat — auf dem Server macht einspielen es genauso
      - run: npm install --no-audit --no-fund
      # Der Browser kommt aus dem Netz. Hängt der Download (am 11.11.2026 zweimal) oder startet der Browser danach nicht,
      # wird Playwright wieder entfernt: dann überspringt sich der Oberflächen-Test, statt bei jedem Start minutenlang
      # zu warten, und die übrigen Tests laufen
      - name: Browser für den Oberflächen-Test
        timeout-minutes: 9
        continue-on-error: true
        run: |
          npm install --no-save playwright
          if timeout 360 npx playwright install --with-deps chromium \
             && timeout 60 node -e "require('playwright').chromium.launch().then(function (b) { return b.close(); })"; then
            echo "Browser bereit"
          else
            echo "::warning title=Oberflächen-Test übersprungen::Der Browser ließ sich nicht installieren oder starten"
            rm -rf node_modules/playwright node_modules/playwright-core
          fi
      - name: Servercode und einspielen prüfen
        run: |
          for f in server.js lib/*.js; do node --check "$f"; done
          bash -n ../werkzeuge/einspielen.sh
      - name: Tests
        timeout-minutes: 12
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-ausgabe.txt
      # Die Protokolle sieht man bei GitHub nur angemeldet — die Fehler stehen deshalb auch als Hinweis auf der Seite des Laufs
      # (Hinweise sind öffentlich lesbar). Je fehlgeschlagenem Test ein Hinweis mit den ersten Zeilen; ohne „not ok“
      # (etwa wenn der Schritt an der Zeitgrenze abgebrochen wurde) die letzten Zeilen der Ausgabe
      - name: Fehler als Hinweis
        if: failure()
        run: |
          [ -f test-ausgabe.txt ] || exit 0
          zeilen() { sed 's/%/%25/g' | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          if grep -q '^\s*not ok' test-ausgabe.txt; then
            grep -n '^\s*not ok' test-ausgabe.txt | head -8 | while IFS=: read -r nr rest; do
              echo "::error title=Test fehlgeschlagen::$(sed -n "${nr},$((nr + 30))p" test-ausgabe.txt | zeilen)"
            done
          else
            echo "::error title=Tests abgebrochen, letzte Ausgabe::$(tail -n 40 test-ausgabe.txt | zeilen)"
          fi
