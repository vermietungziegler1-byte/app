name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Browser für den Oberflächen-Test
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Servercode und einspielen prüfen
        run: |
          for f in server.js lib/*.js; do node --check "$f"; done
          bash -n ../werkzeuge/einspielen.sh
      - run: npm test
