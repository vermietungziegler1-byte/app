name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    # Fest auf 24.04: ubuntu-latest zieht seit Oktober 2026 schrittweise auf Ubuntu 26 um, und der Browser für den
    # Oberflächen-Test bringt seine Systempakete je Ubuntu-Fassung mit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # npm install statt npm ci: neue Pakete aus package.json kommen dazu, auch wenn die Sperrdatei
      # (package-lock.json) noch den alten Stand hat — auf dem Server macht einspielen es genauso
      - run: npm install --no-audit --no-fund
      # Hängt der Download (Browser-Server oder Paketquellen), laufen die übrigen Tests trotzdem — ohne Browser scheitert
      # dann nur der Oberflächen-Test, mit eigener Meldung. Am 11.11.2026 hing der Schritt zehn Minuten und nahm alle Tests mit
      - name: Browser für den Oberflächen-Test
        timeout-minutes: 6
        continue-on-error: true
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Servercode und einspielen prüfen
        run: |
          for f in server.js lib/*.js; do node --check "$f"; done
          bash -n ../werkzeuge/einspielen.sh
      - name: Tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-ausgabe.txt
      # Die Protokolle sieht man bei GitHub nur angemeldet — die Fehler stehen deshalb auch als Hinweis auf der Seite des Laufs
      # (Hinweise sind öffentlich lesbar). Je fehlgeschlagenem Test ein Hinweis mit den ersten Zeilen.
      - name: Fehler als Hinweis
        if: failure()
        run: |
          [ -f test-ausgabe.txt ] || exit 0
          grep -n '^\s*not ok' test-ausgabe.txt | head -8 | while IFS=: read -r nr rest; do
            inhalt=$(sed -n "${nr},$((nr + 30))p" test-ausgabe.txt | sed 's/%/%25/g' | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Test fehlgeschlagen::${inhalt}"
          done
